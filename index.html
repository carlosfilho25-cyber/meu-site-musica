<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">  <!-- ← LIGA O CSS -->
    <title>⛏️ MINECRAFT SIMPLES</title>
</head>
<body>

<div class="game-window">
    <!-- CABEÇALHO -->
    <div class="game-header">
        <h2>⛏️ MINECRAFT SIMPLES</h2>
        <div class="game-stats">
            <div>💎 <span id="pontosDisplay">0</span></div>
            <div>⛏️ <span id="minerioDisplay">0</span></div>
            <div id="vidasDisplay">❤️❤️❤️❤️❤️</div>
        </div>
    </div>

    <!-- MAPA -->
    <div id="mapa"></div>

    <!-- MENSAGEM -->
    <div id="mensagem">🎮 Use as setas para andar ou clique para minerar!</div>

    <!-- CONTROLES -->
    <div class="controls">
        <button id="btnCima">⬆️ Cima</button>
        <button id="btnEsquerda">⬅️ Esq</button>
        <button id="btnBaixo">⬇️ Baixo</button>
        <button id="btnDireita">➡️ Dir</button>
        <button id="btnMinerar" class="danger">⛏️ MINERAR</button>
        <button id="btnReiniciar">🔄 Reiniciar</button>
    </div>

    <!-- LEGENDA -->
    <div class="legenda">
        <div class="legenda-item"><div class="legenda-cor" style="background:#8B6B3D;"></div> Terra</div>
        <div class="legenda-item"><div class="legenda-cor" style="background:#808080;"></div> Pedra</div>
        <div class="legenda-item"><div class="legenda-cor" style="background:#00BFFF;"></div> Minério 💎</div>
        <div class="legenda-item"><div class="legenda-cor" style="background:#FF4500;"></div> Lava 🌋</div>
        <div class="legenda-item"><div class="legenda-cor" style="background:#00ff88;"></div> Você 🧑</div>
        <div class="legenda-item"><div class="legenda-cor" style="background:#00ff44;"></div> Slime 🟢</div>
    </div>
</div>

<script>
// ============================================================
// 🎮 JOGO MINECRAFT SIMPLES - JAVASCRIPT
// ============================================================

// ========== CONFIGURAÇÕES ==========
const TAMANHO = 10;
let mapa = [];
let jogador = { x: 5, y: 5 };
let pontos = 0;
let minerioColetado = 0;
let vidas = 5;
let jogoAtivo = true;
let posicaoSlime = { x: 8, y: 8 };
let turnosSlime = 0;
const RECORDE_KEY = 'recordMinecraft';

// ========== ELEMENTOS ==========
const mapaDiv = document.getElementById('mapa');
const pontosDisplay = document.getElementById('pontosDisplay');
const minerioDisplay = document.getElementById('minerioDisplay');
const vidasDisplay = document.getElementById('vidasDisplay');
const mensagemDiv = document.getElementById('mensagem');

// ========== CORES DOS BLOCOS ==========
const TIPOS = {
    VAZIO: { cor: '#1a0a2e', emoji: '⬛', nome: 'Vazio' },
    TERRA: { cor: '#8B6B3D', emoji: '🟫', nome: 'Terra' },
    PEDRA: { cor: '#808080', emoji: '🪨', nome: 'Pedra' },
    MINERIO: { cor: '#00BFFF', emoji: '💎', nome: 'Minério' },
    LAVA: { cor: '#FF4500', emoji: '🌋', nome: 'Lava' },
    GRAMA: { cor: '#4CAF50', emoji: '🌿', nome: 'Grama' },
    MADEIRA: { cor: '#8B6914', emoji: '🪵', nome: 'Madeira' },
};

// ========== CRIAR MAPA ==========
function criarMapa() {
    mapa = [];
    for (let y = 0; y < TAMANHO; y++) {
        mapa[y] = [];
        for (let x = 0; x < TAMANHO; x++) {
            if (y === 0 || y === TAMANHO-1 || x === 0 || x === TAMANHO-1) {
                mapa[y][x] = { ...TIPOS.VAZIO };
            } else {
                const rand = Math.random();
                let tipo;
                if (rand < 0.05) tipo = TIPOS.LAVA;
                else if (rand < 0.15) tipo = TIPOS.MINERIO;
                else if (rand < 0.30) tipo = TIPOS.PEDRA;
                else if (rand < 0.40) tipo = TIPOS.MADEIRA;
                else if (rand < 0.55) tipo = TIPOS.GRAMA;
                else tipo = TIPOS.TERRA;
                mapa[y][x] = { ...tipo };
            }
        }
    }
    mapa[jogador.y][jogador.x] = { ...TIPOS.VAZIO };
    mapa[posicaoSlime.y][posicaoSlime.x] = { ...TIPOS.VAZIO };
}

// ========== RENDERIZAR MAPA ==========
function renderizar() {
    mapaDiv.style.gridTemplateColumns = `repeat(${TAMANHO}, 1fr)`;
    mapaDiv.innerHTML = '';

    for (let y = 0; y < TAMANHO; y++) {
        for (let x = 0; x < TAMANHO; x++) {
            const bloco = document.createElement('div');
            bloco.className = 'bloco-mapa';

            if (x === jogador.x && y === jogador.y) {
                bloco.textContent = '🧑';
                bloco.classList.add('jogador');
            } else if (x === posicaoSlime.x && y === posicaoSlime.y) {
                bloco.textContent = '🟢';
                bloco.classList.add('monstro');
            } else {
                const dado = mapa[y][x];
                bloco.textContent = dado.emoji || '⬛';
                bloco.style.background = dado.cor || '#1a0a2e';
                bloco.dataset.x = x;
                bloco.dataset.y = y;
                bloco.addEventListener('click', function() {
                    const px = parseInt(this.dataset.x);
                    const py = parseInt(this.dataset.y);
                    minerar(px, py);
                });
            }

            mapaDiv.appendChild(bloco);
        }
    }

    pontosDisplay.textContent = pontos;
    minerioDisplay.textContent = minerioColetado;
    atualizarVidas();
}

// ========== ATUALIZAR VIDAS ==========
function atualizarVidas() {
    let coracoes = '';
    for (let i = 0; i < vidas; i++) coracoes += '❤️';
    for (let i = vidas; i < 5; i++) coracoes += '🖤';
    vidasDisplay.textContent = coracoes;
}

// ========== MOSTRAR MENSAGEM ==========
function mostrarMensagem(texto, cor = '#ffcc00') {
    mensagemDiv.textContent = texto;
    mensagemDiv.style.color = cor;
    setTimeout(() => {
        if (jogoAtivo) {
            mensagemDiv.textContent = '🎮 Use as setas para andar ou clique para minerar!';
            mensagemDiv.style.color = '#ffcc00';
        }
    }, 2000);
}

// ========== MOVER JOGADOR ==========
function moverJogador(dx, dy) {
    if (!jogoAtivo) return;

    const nx = jogador.x + dx;
    const ny = jogador.y + dy;

    if (nx < 0 || nx >= TAMANHO || ny < 0 || ny >= TAMANHO) {
        mostrarMensagem('🚫 Não pode sair do mapa!', '#ff4444');
        return;
    }

    if (mapa[ny][nx].nome !== 'Vazio') {
        mostrarMensagem('⛔ Bloco ocupado! Minere primeiro!', '#ff8800');
        return;
    }

    if (nx === posicaoSlime.x && ny === posicaoSlime.y) {
        mostrarMensagem('💀 O SLIME TE PEGOU! -1 vida!', '#ff4444');
        vidas--;
        atualizarVidas();
        if (vidas <= 0) {
            gameOver();
            return;
        }
        jogador.x = 5;
        jogador.y = 5;
        mapa[jogador.y][jogador.x] = { ...TIPOS.VAZIO };
        renderizar();
        return;
    }

    jogador.x = nx;
    jogador.y = ny;
    
    turnosSlime++;
    if (turnosSlime % 2 === 0) {
        moverSlime();
    }

    renderizar();
    verificarVitoria();
}

// ========== MOVER SLIME ==========
function moverSlime() {
    const direcoes = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    const dir = direcoes[Math.floor(Math.random() * direcoes.length)];
    const nx = posicaoSlime.x + dir[0];
    const ny = posicaoSlime.y + dir[1];

    if (nx >= 0 && nx < TAMANHO && ny >= 0 && ny < TAMANHO) {
        const bloco = mapa[ny][nx];
        if (bloco.nome === 'Vazio' && !(nx === jogador.x && ny === jogador.y)) {
            posicaoSlime.x = nx;
            posicaoSlime.y = ny;
        }
    }
}

// ========== MINERAR ==========
function minerar(x, y) {
    if (!jogoAtivo) return;
    if (x === jogador.x && y === jogador.y) {
        mostrarMensagem('🧑 Você está aqui! Não pode se minerar!', '#ff8800');
        return;
    }
    if (x === posicaoSlime.x && y === posicaoSlime.y) {
        mostrarMensagem('🟢 Não pode minerar o Slime!', '#ff4444');
        return;
    }

    const bloco = mapa[y][x];
    if (bloco.nome === 'Vazio') {
        mostrarMensagem('⬛ Já está vazio!', '#888888');
        return;
    }

    const pontosGanhos = bloco.nome === 'Minério' ? 5 :
                        bloco.nome === 'Pedra' ? 2 :
                        bloco.nome === 'Lava' ? -1 :
                        bloco.nome === 'Madeira' ? 3 : 1;

    if (bloco.nome === 'Lava') {
        vidas--;
        atualizarVidas();
        mostrarMensagem('🌋 LAVA! Perdeu 1 vida!', '#ff4444');
        if (vidas <= 0) {
            gameOver();
            return;
        }
    } else {
        pontos += pontosGanhos;
        if (bloco.nome === 'Minério') {
            minerioColetado++;
            mostrarMensagem(`💎 Minério encontrado! +${pontosGanhos} pontos!`, '#00ccff');
        } else {
            mostrarMensagem(`⛏️ ${bloco.nome} minerado! +${pontosGanhos} pontos`, '#88ff88');
        }
    }

    mapa[y][x] = { ...TIPOS.VAZIO };
    
    if (Math.random() < 0.1) {
        const pos = posicaoAleatoriaVazia();
        if (pos) {
            mapa[pos.y][pos.x] = { ...TIPOS.MINERIO };
        }
    }

    renderizar();
    verificarVitoria();
}

// ========== POSIÇÃO ALEATÓRIA VAZIA ==========
function posicaoAleatoriaVazia() {
    for (let i = 0; i < 50; i++) {
        const x = Math.floor(Math.random() * (TAMANHO-2)) + 1;
        const y = Math.floor(Math.random() * (TAMANHO-2)) + 1;
        if (mapa[y][x].nome === 'Vazio' && 
            !(x === jogador.x && y === jogador.y) &&
            !(x === posicaoSlime.x && y === posicaoSlime.y)) {
            return { x, y };
        }
    }
    return null;
}

// ========== VERIFICAR VITÓRIA ==========
function verificarVitoria() {
    if (minerioColetado >= 10) {
        jogoAtivo = false;
        const recorde = localStorage.getItem(RECORDE_KEY) || 0;
        if (pontos > parseInt(recorde)) {
            localStorage.setItem(RECORDE_KEY, pontos);
            mostrarMensagem(`🏆 VITÓRIA! ${pontos} pontos! NOVO RECORDE! 🏆`, '#ffdd00');
        } else {
            mostrarMensagem(`🎉 VITÓRIA! ${pontos} pontos! Recorde: ${recorde}`, '#ffdd00');
        }
    }
}

// ========== GAME OVER ==========
function gameOver() {
    jogoAtivo = false;
    const recorde = localStorage.getItem(RECORDE_KEY) || 0;
    if (pontos > parseInt(recorde)) {
        localStorage.setItem(RECORDE_KEY, pontos);
        mostrarMensagem(`💀 GAME OVER! ${pontos} pontos! NOVO RECORDE!`, '#ff4444');
    } else {
        mostrarMensagem(`💀 GAME OVER! ${pontos} pontos. Recorde: ${recorde}`, '#ff4444');
    }
}

// ========== REINICIAR ==========
function reiniciar() {
    jogador = { x: 5, y: 5 };
    pontos = 0;
    minerioColetado = 0;
    vidas = 5;
    jogoAtivo = true;
    posicaoSlime = { x: 8, y: 8 };
    turnosSlime = 0;
    criarMapa();
    mapa[jogador.y][jogador.x] = { ...TIPOS.VAZIO };
    mapa[posicaoSlime.y][posicaoSlime.x] = { ...TIPOS.VAZIO };
    renderizar();
    mostrarMensagem('🔄 Jogo reiniciado! Boa sorte!', '#88ff88');
}

// ========== CONTROLES POR TECLADO ==========
document.addEventListener('keydown', function(e) {
    switch(e.key) {
        case 'ArrowUp': e.preventDefault(); moverJogador(0, -1); break;
        case 'ArrowDown': e.preventDefault(); moverJogador(0, 1); break;
        case 'ArrowLeft': e.preventDefault(); moverJogador(-1, 0); break;
        case 'ArrowRight': e.preventDefault(); moverJogador(1, 0); break;
        case ' ': e.preventDefault(); minerar(jogador.x, jogador.y + 1); break;
    }
});

// ========== BOTÕES ==========
document.getElementById('btnCima').addEventListener('click', () => moverJogador(0, -1));
document.getElementById('btnBaixo').addEventListener('click', () => moverJogador(0, 1));
document.getElementById('btnEsquerda').addEventListener('click', () => moverJogador(-1, 0));
document.getElementById('btnDireita').addEventListener('click', () => moverJogador(1, 0));
document.getElementById('btnMinerar').addEventListener('click', () => minerar(jogador.x, jogador.y + 1));
document.getElementById('btnReiniciar').addEventListener('click', reiniciar);

// ========== INICIAR ==========
reiniciar();
</script>

</body>
</html>
